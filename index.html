ck';tool.innerHTML='<button class="back" onclick="tool.style.display='none'">← Back</button><h2>'+esc(t.name)+'</h2><p>'+esc(t.cat)+' tool #'+id+'</p>'+ui(t);window.scrollTo({top:tool.offsetTop-10,behavior:'smooth'})}function ui(t){let n=t.name;if(n==='Basic Calculator')return `<div class="row"><input id="a" placeholder="12+8*2" style="min-width:260px"><button class="primary" onclick="calc()">Calculate</button></div><div class="out" id="o"></div>`;if(n==='Stopwatch')return `<h2 id="clock">00:00.00</h2><button class="primary" onclick="swStart()">Start</button> <button onclick="swStop()">Stop</button> <button onclick="swReset()">Reset</button>`;if(n==='Word Counter'||n==='Character Counter'||n==='Line Counter')return `<textarea id="txt" oninput="countText('${n}')" placeholder="Paste text here..."></textarea><div class="out" id="o">0</div>`;if(n==='Password Generator'||n==='Strong Password Generator')return `<div class="row"><input id="len" type="number" value="18" min="4" max="128"><button class="primary" onclick="password()">Generate</button></div><div class="out" id="o"></div>`;if(n==='Percentage Finder')return `<div class="row"><input id="a" type="number" placeholder="Percent"><input id="b" type="number" placeholder="Number"><button class="primary" onclick="pct()">Calculate</button></div><div class="out" id="o"></div>`;if(n==='Celsius to Fahrenheit')return conv('Celsius','Fahrenheit','x*9/5+32');if(n==='Fahrenheit to Celsius')return conv('Fahrenheit','Celsius','(x-32)*5/9');if(n==='Kilometers to Miles')return conv('Kilometers','Miles','x*0.621371');if(n==='Miles to Kilometers')return conv('Miles','Kilometers','x*1.609344');if(n==='Kilograms to Pounds')return conv('Kilograms','Pounds','x*2.2046226218');if(n==='Pounds to Kilograms')return conv('Pounds','Kilograms','x/2.2046226218');if(n==='Random Number Generator')return `<div class="row"><input id="a" type="number" placeholder="Min"><input id="b" type="number" placeholder="Max"><button class="primary" onclick="rnd() ().join('')}function dice(n){let d=n==='D20 Roller'?20:n==='D100 Roller'?100:6;o.textContent=Math.floor(Math.random()*d)+1}function generic(n){let x=txt.value;o.textContent='Tool: '+n+'\n\nInput received: '+x.length+' characters.\n\nThis standalone tool is ready for its specialized workflow.'}let timer=null,st=0,el=0;function swTick(){let x=el+Date.now()-st;clock.textContent=String(Math.floor(x/60000)).padStart(2,'0')+':'+String(Math.floor(x/1000)%60).padStart(2,'0')+'.'+String(Math.floor(x/10)%100).padStart(2,'0')}function swStart(){if(!timer){st=Date.now();timer=setInterval(swTick,10)}}function swStop(){if(timer){el+=Date.now()-st;clearInterval(timer);timer=null}}function swReset(){clearInterval(timer);timer=null;el=0;clock.textContent='00:00.00'}q.oninput=render;render();</script></body></html>
