const app=document.getElementById('app');
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function home(){location.hash=''; renderHome()}
function renderHome(){
 const cats=['All',...new Set(tools.map(t=>t.cat))];
 app.innerHTML=`<div class="top"><div class="nav"><div class="brand">⚡ ToolForge</div><div class="pill">1000 tools</div><input id="search" class="search" placeholder="Search 1000 tools..."></div></div><section class="hero"><h1>1000 useful tools.</h1><p>Calculators, generators, converters, productivity tools & more. Pick one and cook. 🔥</p></section><div class="filters">${cats.map((c,i)=>`<button class="filter ${i===0?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="count" class="count"></div><main id="grid" class="grid"></main>`;
 let active='All',q='';
 const draw=()=>{let list=tools.filter(t=>(active==='All'||t.cat===active)&&t.name.toLowerCase().includes(q));document.getElementById('count').textContent=`Showing ${list.length} of 1000 tools`;document.getElementById('grid').innerHTML=list.map(t=>`<article class="card"><div><div class="cat">${esc(t.cat)}</div><div class="name">${esc(t.name)}</div></div><button class="open" onclick="location.hash='tool/${t.id}'">Open</button></article>`).join('')||'<div style="color:#777">No tools found 😭</div>'};
 document.getElementById('search').oninput=e=>{q=e.target.value.toLowerCase();draw()};
 document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.cat;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});draw();
}
function control(name){
 const n=name.toLowerCase();
 if(n.includes('password generator')) return `<label>Length</label><input id="a" class="input" type="number" value="18" min="6" max="100"><button class="btn" onclick="genPass()">Generate</button><div id="r" class="result"></div>`;
 if(n.includes('random number')) return `<div class="row"><div><label>Min</label><input id="a" class="input" type="number" value="1"></div><div><label>Max</label><input id="b" class="input" type="number" value="100"></div></div><button class="btn" onclick="randNum()">Generate</button><div id="r" class="result"></div>`;
 if(n.includes('coin flip')) return `<button class="btn" onclick="flip()">Flip Coin</button><div id="r" class="result"></div>`;
 if(n.includes('dice roller')) return `<button class="btn" onclick="dice()">Roll 🎲</button><div id="r" class="result"></div>`;
 if(n.includes('percentage')) return `<input id="a" class="input" type="number" placeholder="Percent"><input id="b" class="input" type="number" placeholder="Number"><button class="btn" onclick="percent()">Calculate</button><div id="r" class="result"></div>`;
 if(n.includes('discount')) return `<input id="a" class="input" type="number" placeholder="Price"><input id="b" class="input" type="number" placeholder="Discount %"><button class="btn" onclick="discount()">Calculate</button><div id="r" class="result"></div>`;
 if(n.includes('tip')) return `<input id="a" class="input" type="number" placeholder="Bill"><input id="b" class="input" type="number" placeholder="Tip %"><button class="btn" onclick="tip()">Calculate</button><div id="r" class="result"></div>`;
 if(n.includes('word counter')||n.includes('character counter')||n.includes('line counter')) return `<textarea id="a" class="input" rows="8" placeholder="Paste text here..."></textarea><button class="btn" onclick="countText()">Count</button><div id="r" class="result"></div>`;
 if(n.includes('case converter')) return `<textarea id="a" class="input" rows="7" placeholder="Type text..."></textarea><button class="btn" onclick="caseConv('upper')">UPPER</button> <button class="btn" onclick="caseConv('lower')">lower</button><div id="r" class="result"></div>`;
 if(n.includes('stopwatch')) return `<button class="btn" onclick="swStart()">Start</button> <button class="btn" onclick="swStop()">Stop</button> <button class="btn" onclick="swReset()">Reset</button><div id="r" class="result">00:00.000</div>`;
 return `<p>This dedicated tool page is ready. Use the controls below to start building the exact calculation/generator.</p><input id="a" class="input" placeholder="Enter a value"><button class="btn" onclick="demo()">Run Tool</button><div id="r" class="result">Ready.</div>`;
}
function renderTool(id){const t=tools[id];app.innerHTML=`<main class="page"><span class="back" onclick="home()">← Back to all tools</span><section class="box"><div class="cat">${esc(t.cat)}</div><h1>${esc(t.name)}</h1><p>A dedicated ToolForge page for this tool.</p>${control(t.name)}</section></main>`}
function out(v){document.getElementById('r').textContent=v}
function genPass(){let n=Math.max(6,Math.min(100,+a.value||18)),c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*',s='';for(let i=0;i<n;i++)s+=c[Math.random()*c.length|0];out(s)}
function randNum(){let x=+a.value,y=+b.value;out(Math.floor(Math.random()*(y-x+1))+x)}
function flip(){out(Math.random()<.5?'Heads 🪙':'Tails 🪙')}
function dice(){out('You rolled '+(1+Math.random()*6|0)+' 🎲')}
function percent(){out((+a.value/100*+b.value).toFixed(2))}
function discount(){let p=+a.value,d=+b.value;out(`You save ${(p*d/100).toFixed(2)} — final: ${(p-p*d/100).toFixed(2)}`)}
function tip(){let p=+a.value,t=+b.value;out(`Tip: ${(p*t/100).toFixed(2)} — total: ${(p+p*t/100).toFixed(2)}`)}
function countText(){let s=a.value;out(`Words: ${s.trim()?s.trim().split(/\s+/).length:0} | Characters: ${s.length} | Lines: ${s?s.split('\n').length:0}`)}
function caseConv(x){out(x==='upper'?a.value.toUpperCase():a.value.toLowerCase())}
let timer=0,interval=null;function swStart(){if(!interval){let st=Date.now()-timer;interval=setInterval(()=>{timer=Date.now()-st;out(new Date(timer).toISOString().slice(14,19)+'.'+String(timer%1000).padStart(3,'0'))},10)}}function swStop(){clearInterval(interval);interval=null}function swReset(){swStop();timer=0;out('00:00.000')}
function demo(){out('Tool executed. Result: '+(a.value||'Done'))}
window.addEventListener('hashchange',()=>{let m=location.hash.match(/^#tool\/(\d+)$/);m?renderTool(+m[1]):renderHome()});let m=location.hash.match(/^#tool\/(\d+)$/);m?renderTool(+m[1]):renderHome();
</script></body></html>
